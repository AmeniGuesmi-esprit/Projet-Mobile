name: proxilife
description: ProxiLife — services de proximité, compte et paiement unifiés.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0
  local_auth: ^3.0.2
  image_picker: ^1.2.4
  flutter_local_notifications: ^22.3.1
  intl: ^0.20.3
  # FoodSave: GPS, QR display/scan, interactive map (OpenStreetMap tiles)
  geolocator: ^14.1.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.3
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  proxilife_shared:
    path: ../packages/proxilife_shared
  url_launcher: ^6.3.3
  # ServiceNow: rapport d'intervention en PDF
  pdf: ^3.12.0
  printing: ^5.14.3
  # Covoiturage: embarquement par Bluetooth
  flutter_blue_plus: ^2.3.14
  flutter_ble_peripheral: ^3.1.0
  # CoachProche: compteur de pas (accéléromètre)
  sensors_plus: ^6.1.1
  # TeleDoc: historique des consultations sur le téléphone (lecture hors ligne)
  sqflite: ^2.4.5
  path: ^1.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # TeleDoc: sqflite sur le PC pour flutter test
  sqflite_common_ffi: ^2.4.3

flutter:
  uses-material-design: true

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VF.ttf
